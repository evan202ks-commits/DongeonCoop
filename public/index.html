<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DongeonCoop — terrain partagé</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<canvas id="stage"></canvas>

<div id="touch"><div class="stick" hidden><div class="knob"></div></div></div>

<div class="hud">
  <div class="hud-row">
    <div class="panel">
      <h2>Terrain</h2>
      <div class="stat">Salle <b id="roomId">—</b></div>
      <div class="stat">Joueurs <b id="playerCount">0</b></div>
      <div class="stat">Latence <b id="ping">—</b> ms</div>
    </div>
    <div class="panel">
      <h2>Sur le terrain</h2>
      <ul id="roster"></ul>
    </div>
  </div>
  <div class="hud-row">
    <div class="panel" id="log"></div>
    <div></div>
  </div>
</div>

<div class="gate" id="gate">
  <div class="gate-card">
    <h1>DONGEON COOP</h1>
    <p>Entre ton nom, tu seras déposé sur le terrain avec les autres joueurs connectés.</p>
    <input id="nameInput" type="text" maxlength="14" placeholder="Ton nom" autocomplete="off">
    <button class="action" id="joinBtn">Rejoindre le terrain</button>
    <div class="note">Déplacements : ZQSD / WASD / flèches — joystick tactile sur mobile.<br>
      <a href="/snake.html">Ancien mini-jeu Snake</a></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
